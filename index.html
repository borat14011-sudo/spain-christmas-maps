<style>
  :root {
    --navy: #0a1d3a;
    --navy-deep: #050f1f;
    --navy-light: #16335c;
    --gold: #d4af37;
    --gold-bright: #f0c75e;
    --cream: #f6efde;
    --red: #c0392b;
    --blue: #2a6fc9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--navy-deep); color: var(--cream); display: flex; flex-direction: column; }

  header {
    background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 60%, var(--navy-light) 100%);
    color: var(--cream);
    padding: 18px 28px 14px;
    border-bottom: 3px solid var(--gold);
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  header h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.5px; line-height: 1.2; }
  header h1 .gold { color: var(--gold); font-weight: 500; }
  header .sub { margin-top: 4px; font-size: 12px; color: rgba(246,239,222,0.6); letter-spacing: 0.5px; }

  .tabs {
    display: flex;
    align-items: center;
    background: var(--navy);
    border-bottom: 2px solid rgba(212,175,55,0.3);
    padding: 0 12px;
    flex-shrink: 0;
  }
  .tab {
    padding: 12px 20px;
    cursor: pointer;
    color: rgba(246,239,222,0.55);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
    user-select: none;
  }
  .tab:hover { color: var(--gold-bright); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .legend {
    margin-left: auto;
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 0 8px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(246,239,222,0.65); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4); }
  .legend-dot.gold { background: var(--gold); }
  .legend-dot.blue { background: var(--blue); }
  .legend-dot.red { background: var(--red); }

  #map { flex: 1; }

  /* ── Popup styling ── */
  .iw {
    width: 270px;
    padding: 12px 14px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--navy);
    color: var(--cream);
  }
  .iw .kind {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(246,239,222,0.5);
    margin-bottom: 3px;
    font-weight: 600;
  }
  .iw .title { color: var(--gold-bright); font-size: 15px; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 7px; line-height: 1.2; }
  .iw .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .iw .pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.4px;
  }
  .iw .pill.cuisine { background: rgba(212,175,55,0.18); color: var(--gold-bright); border: 1px solid rgba(212,175,55,0.4); }
  .iw .pill.price   { background: rgba(255,255,255,0.08); color: var(--cream); border: 1px solid rgba(255,255,255,0.2); }
  .iw .pill.rating  { background: rgba(240,199,94,0.15); color: var(--gold-bright); border: 1px solid rgba(240,199,94,0.4); }
  .iw .pill.walk    { background: rgba(42,111,201,0.18); color: #9ec3ee; border: 1px solid rgba(42,111,201,0.4); }
  .iw .book-now {
    display: inline-block; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    color: var(--navy-deep); padding: 3px 10px; border-radius: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px; margin-bottom: 8px;
  }
  .iw .tip { color: var(--cream); font-size: 12.5px; line-height: 1.45; margin: 0 0 7px; opacity: 0.92; }
  .iw .xmas {
    margin-top: 5px; padding: 6px 8px;
    background: rgba(192,57,43,0.12); border-left: 2px solid var(--red); border-radius: 3px;
    font-size: 11.5px; color: #f4c4be; line-height: 1.4;
  }
  .iw .xmas::before { content: "🎄 "; }
  .iw .out-note { margin-top: 7px; font-size: 11px; color: rgba(240,199,94,0.7); font-style: italic; }

  /* Override Leaflet popup chrome */
  .leaflet-popup-content-wrapper {
    background: var(--navy) !important;
    color: var(--cream) !important;
    border-radius: 10px !important;
    padding: 0 !important;
    box-shadow: 0 6px 24px rgba(0,0,0,0.7) !important;
    border: 1px solid rgba(212,175,55,0.4) !important;
  }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-tip { background: var(--navy) !important; }
  .leaflet-popup-close-button { color: var(--gold) !important; font-size: 18px !important; top: 6px !important; right: 8px !important; }
  .leaflet-popup-close-button:hover { color: var(--gold-bright) !important; }

  /* Leaflet attribution dark */
  .leaflet-control-attribution { background: rgba(5,15,31,0.8) !important; color: rgba(246,239,222,0.5) !important; }
  .leaflet-control-attribution a { color: rgba(212,175,55,0.7) !important; }
</style>
</head>

const CITIES = {
  Seville: { lat: 37.3886, lng: -5.9953, zoom: 14 },
  Segovia: { lat: 40.9485, lng: -4.118,  zoom: 15 },
  Madrid:  { lat: 40.4168, lng: -3.7038, zoom: 14 }
};

// ── Map init ──────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true })
  .setView([CITIES.Seville.lat, CITIES.Seville.lng], CITIES.Seville.zoom);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── Custom pin icon ──────────────────────────────────────────────────────
function pinIcon(color, glyph, ring) {
  ring = ring || 'rgba(255,255,255,0.85)';
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='36' height='46' viewBox='0 0 36 46'>
    <defs><filter id='s'><feDropShadow dx='0' dy='2' stdDeviation='2' flood-color='black' flood-opacity='0.5'/></filter></defs>
    <path filter='url(#s)' fill='${color}' stroke='${ring}' stroke-width='2'
      d='M18 2C9 2 2 9 2 17.5c0 11 16 26 16 26s16-15 16-26C34 9 27 2 18 2z'/>
    <text x='18' y='23' text-anchor='middle' font-size='14'
      font-family='Segoe UI Symbol,Apple Color Emoji,sans-serif' fill='white'>${glyph}</text>
  </svg>`;
  return L.divIcon({
    html: `<div style="width:36px;height:46px">${svg}</div>`,
    className: '', iconSize: [36, 46], iconAnchor: [18, 44], popupAnchor: [0, -44]
  });
}

const ICONS = {
  restaurant: (mustBook) => pinIcon(mustBook ? '#b8920a' : '#d4af37', mustBook ? '★' : '🍽'),
  hotel: pinIcon('#2a6fc9', '🏨'),
  site: pinIcon('#c0392b', '🏛'),
};

// ── HTML builders ────────────────────────────────────────────────────────
function esc(s){ return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function restHtml(r) {
  const stars = '★'.repeat(Math.round(r.rating||0)) + '☆'.repeat(5-Math.round(r.rating||0));
  return `<div class="iw">
    <div class="kind">Restaurant</div>
    <div class="title">${esc(r.name)}</div>
    <div class="pills">
      <span class="pill cuisine">${esc(r.cuisine)}</span>
      <span class="pill price">${esc(r.price)}</span>
      <span class="pill rating">${stars} ${r.rating}</span>
      <span class="pill walk">🚶 ${r.walk_min} min</span>
    </div>
    ${r.must_book ? '<div class="book-now">★ BOOK NOW</div>' : ''}
    <div class="tip">${esc(r.tip)}</div>
    ${r.christmas_note ? `<div class="xmas">${esc(r.christmas_note)}</div>` : ''}
  </div>`;
}

function hotelHtml(h) {
  return `<div class="iw">
    <div class="kind">Hotel · Your stay</div>
    <div class="title">${esc(h.name)}</div>
    <div class="tip">${esc(h.formatted_address||'')}</div>
  </div>`;
}

function siteHtml(s) {
  return `<div class="iw">
    <div class="kind">Key Site</div>
    <div class="title">${esc(s.name)}</div>
    <div class="tip">${esc(s.formatted_address||'')}</div>
  </div>`;
}

// ── Build layers ──────────────────────────────────────────────────────────
const layers = { Seville: [], Segovia: [], Madrid: [] };

['Seville','Segovia','Madrid'].forEach(city => {
  const cityLayers = [];

  DATA.restaurants.filter(r => r.city === city && r.lat).forEach(r => {
    const m = L.marker([r.lat, r.lng], { icon: ICONS.restaurant(r.must_book) })
      .bindPopup(restHtml(r), { maxWidth: 290, className: '' });
    cityLayers.push(m);
  });

  DATA.hotels.filter(h => h.city === city && h.lat).forEach(h => {
    const m = L.marker([h.lat, h.lng], { icon: ICONS.hotel, zIndexOffset: 1000 })
      .bindPopup(hotelHtml(h), { maxWidth: 290 });
    cityLayers.push(m);
  });

  DATA.sites.filter(s => s.city === city && s.lat).forEach(s => {
    const m = L.marker([s.lat, s.lng], { icon: ICONS.site })
      .bindPopup(siteHtml(s), { maxWidth: 290 });
    cityLayers.push(m);
  });

  layers[city] = cityLayers;
});

// ── City switching ────────────────────────────────────────────────────────
let currentCity = 'Seville';
let activeLayers = [];

function showCity(city) {
  activeLayers.forEach(m => map.removeLayer(m));
  activeLayers = layers[city];
  activeLayers.forEach(m => m.addTo(map));
  const c = CITIES[city];
  map.setView([c.lat, c.lng], c.zoom, { animate: true, duration: 0.6 });
  currentCity = city;
}

function switchCity(city, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  showCity(city);
}

// ── Init ──────────────────────────────────────────────────────────────────
showCity('Seville');
</script>
