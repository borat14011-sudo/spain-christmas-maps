<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spain Christmas 2026 — Interactive Maps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#1B3A6B;--gold:#C49A22;--parch:#F3E9CB;--parch2:#EAD9AA;
    --cream:#F9F7F2;--rust:#6E2C10;--slate:#2D4A5E;--dark:#1a1a2e;
  }
  body{font-family:'Georgia',serif;background:var(--parch);color:var(--navy);height:100vh;display:flex;flex-direction:column}

  /* ── HEADER ── */
  header{background:var(--navy);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
  header h1{color:var(--gold);font-size:1.25rem;font-weight:bold;letter-spacing:.03em}
  header span{color:#aabbdd;font-size:.8rem}
  .legend{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:.75rem}
  .leg{display:flex;align-items:center;gap:4px;color:#ddd}
  .leg-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}

  /* ── TABS ── */
  .tabs{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);flex-shrink:0}
  .tab{padding:10px 28px;cursor:pointer;color:#8899bb;font-size:.9rem;letter-spacing:.05em;transition:.2s;border:none;background:none;font-family:inherit}
  .tab:hover{color:var(--gold)}
  .tab.active{color:var(--gold);background:rgba(196,154,34,.12);border-bottom:3px solid var(--gold);margin-bottom:-3px}

  /* ── MAIN BODY ── */
  .body{display:flex;flex:1;overflow:hidden}

  /* ── SIDEBAR ── */
  .sidebar{width:300px;background:var(--cream);border-right:1px solid var(--parch2);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  .sidebar-head{padding:12px 14px;background:var(--parch);border-bottom:1px solid var(--parch2)}
  .sidebar-head h3{font-size:.8rem;color:var(--navy);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .filter-btn{padding:3px 9px;border-radius:12px;border:1px solid var(--parch2);background:white;color:var(--navy);font-size:.72rem;cursor:pointer;transition:.15s}
  .filter-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}
  .filter-btn:hover:not(.active){border-color:var(--navy)}
  .search-box{width:100%;margin-top:8px;padding:5px 10px;border:1px solid var(--parch2);border-radius:6px;font-size:.8rem;background:white;color:var(--navy)}
  .search-box:focus{outline:none;border-color:var(--navy)}
  .sidebar-count{font-size:.7rem;color:#888;margin-top:4px}

  .rest-list{overflow-y:auto;flex:1}
  .rest-item{padding:10px 14px;border-bottom:1px solid var(--parch);cursor:pointer;transition:.15s}
  .rest-item:hover{background:var(--parch)}
  .rest-item.focused{background:#e8f0fb;border-left:3px solid var(--navy)}
  .rest-name{font-size:.85rem;font-weight:bold;color:var(--navy)}
  .rest-meta{font-size:.73rem;color:#666;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.68rem;font-weight:bold}
  .pill-price{background:var(--parch2);color:var(--navy)}
  .pill-book{background:#b00;color:white}
  .pill-xmas{background:#1a6b2a;color:white}
  .pill-stars{background:var(--parch);color:var(--navy)}

  /* ── MAP ── */
  #map{flex:1}

  /* ── POPUPS ── */
  .pop{min-width:210px;max-width:270px;font-family:Georgia,serif}
  .pop-name{font-size:.95rem;font-weight:bold;color:var(--gold);margin-bottom:4px}
  .pop-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
  .pop-tip{font-size:.78rem;color:#444;font-style:italic;line-height:1.4}
  .pop-xmas{margin-top:5px;font-size:.75rem;color:#1a6b2a;background:#edf7ed;border-left:3px solid #1a6b2a;padding:3px 6px}
  .pop-walk{font-size:.75rem;color:#555;margin-top:4px}
  .leaflet-popup-content-wrapper{border-radius:6px;padding:0;overflow:hidden}
  .leaflet-popup-content{margin:12px 14px;font-family:Georgia,serif}
  .pop-header{background:var(--navy);padding:8px 12px;margin:-12px -14px 10px}
  .pop-hotel-name{font-size:.95rem;font-weight:bold;color:var(--gold)}
  .pop-hotel-sub{font-size:.75rem;color:#aabbdd}
  .pop-site-name{font-size:.95rem;font-weight:bold;color:var(--navy)}
  .pop-addr{font-size:.75rem;color:#666;margin-top:3px}

  /* ── No-results ── */
  .no-results{padding:20px;text-align:center;color:#999;font-size:.82rem}

  /* ── Clusters ── */
  .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(196,154,34,.25)}
  .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:var(--gold);color:var(--navy);font-weight:bold}
</style>
</head>

const SITES       = [{"name":"Real Alc\u00e1zar de Sevilla","city":"Seville","query":"Real Alc\u00e1zar de Sevilla, Seville, Spain","lat":37.3830519,"lng":-5.9902257,"display_name":"Royal Alc\u00e1zar of Seville","formatted_address":"Casco Antiguo, 41004 Seville, Spain"},{"name":"Catedral de Sevilla","city":"Seville","query":"Catedral de Sevilla, Spain","lat":37.3858247,"lng":-5.9931068,"display_name":"Catedral de Sevilla","formatted_address":"Av. de la Constituci\u00f3n, s/n, Casco Antiguo, 41004 Sevilla, Spain"},{"name":"Plaza de Espa\u00f1a","city":"Seville","query":"Plaza de Espa\u00f1a, Seville, Spain","lat":37.3771957,"lng":-5.986892999999999,"display_name":"Plaza de Espa\u00f1a","formatted_address":"Av. Isabel la Cat\u00f3lica, 41004 Sevilla, Spain"},{"name":"Triana Bridge","city":"Seville","query":"Puente de Triana, Seville, Spain","lat":37.3862995,"lng":-6.0024389,"display_name":"Puente de Isabel II","formatted_address":"Puente de Isabel II, Sevilla, Spain"},{"name":"Alc\u00e1zar de Segovia","city":"Segovia","query":"Alc\u00e1zar de Segovia, Spain","lat":40.952572499999995,"lng":-4.1325378,"display_name":"Alc\u00e1zar de Segovia","formatted_address":"Pl. Reina Victoria Eugenia, s/n, 40003 Segovia, Spain"},{"name":"Catedral de Segovia","city":"Segovia","query":"Catedral de Segovia, Spain","lat":40.9502161,"lng":-4.1253059,"display_name":"Catedral de Segovia","formatted_address":"C. Marqu\u00e9s del Arco, 1, 40001 Segovia, Spain"},{"name":"Aqueduct of Segovia","city":"Segovia","query":"Acueducto de Segovia, Spain","lat":40.9480584,"lng":-4.1178956,"display_name":"Segovia Aqueduct","formatted_address":"Pl. Azoguejo, 1, 40001 Segovia, Spain"},{"name":"Plaza Mayor Segovia","city":"Segovia","query":"Plaza Mayor de Segovia, Spain","lat":40.9502583,"lng":-4.124031899999999,"display_name":"Plaza Mayor","formatted_address":"Plaza Mayor, Segovia, Spain"},{"name":"Museo del Prado","city":"Madrid","query":"Museo del Prado, Madrid, Spain","lat":40.413781799999995,"lng":-3.6921270999999996,"display_name":"Museo Nacional del Prado","formatted_address":"Retiro, 28014 Madrid, Spain"},{"name":"Parque del Retiro","city":"Madrid","query":"Parque del Retiro, Madrid, Spain","lat":40.415258,"lng":-3.6834656999999997,"display_name":"El Retiro Park","formatted_address":"Retiro, 28009 Madrid, Spain"},{"name":"Puerta del Sol","city":"Madrid","query":"Puerta del Sol, Madrid, Spain","lat":40.4169473,"lng":-3.7035285,"display_name":"Puerta del Sol","formatted_address":"Puerta del Sol, Centro, Madrid, Spain"},{"name":"Plaza Mayor Madrid","city":"Madrid","query":"Plaza Mayor de Madrid, Spain","lat":40.415618099999996,"lng":-3.707023,"display_name":"Plaza Mayor","formatted_address":"Plaza Mayor, Centro, Madrid, Spain"},{"name":"Sobrino de Bot\u00edn (site)","city":"Madrid","query":"Sobrino de Bot\u00edn, Madrid, Spain","lat":40.4141933,"lng":-3.7079761,"display_name":"BOTIN","formatted_address":"C. de Cuchilleros, 17, Centro, 28005 Madrid, Spain"},{"name":"Chocolater\u00eda San Gin\u00e9s (site)","city":"Madrid","query":"Chocolater\u00eda San Gin\u00e9s, Madrid, Spain","lat":40.4167385,"lng":-3.7069356,"display_name":"Chocolater\u00eda San Gin\u00e9s","formatted_address":"Pasadizo de San Gin\u00e9s, 5, Centro, 28013 Madrid, Spain"},{"name":"Gran V\u00eda Madrid","city":"Madrid","query":"Gran V\u00eda, Madrid, Spain","lat":40.4189329,"lng":-3.6968903,"display_name":"Gran V\u00eda","formatted_address":"Gran V\u00eda, Centro, Madrid, Spain"}];

const CITY_CENTRES = {
  Seville: {lat:37.3891,lng:-5.9845,zoom:14},
  Segovia: {lat:40.9429,lng:-4.1088,zoom:14},
  Madrid:  {lat:40.4168,lng:-3.7038,zoom:13},
};
const CITY_COLORS = {Seville:'#6E2C10',Segovia:'#2D4A5E',Madrid:'#1B3A6B'};

let currentCity = 'Seville';
let filterPrice = 'ALL';
let markerMap = {};  // stem → leaflet marker
let restaurantLayers = {};
let hotelLayers = {};
let siteLayers = {};
let clusterGroup = null;

// ── Map init ──────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:true}).setView([37.3891,-5.9845],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://osm.org/copyright">OpenStreetMap</a>',
  maxZoom:19
}).addTo(map);

// ── Custom icons ──────────────────────────────────────────────────────────
function makeIcon(emoji, bg, size=30){
  return L.divIcon({
    html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:${size*0.5}px;box-shadow:0 2px 6px rgba(0,0,0,.35)">${emoji}</div>`,
    className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]
  });
}
const ICONS = {
  restaurant: (mustBook) => makeIcon(mustBook?'★':'🍽','#C49A22',28),
  hotel: makeIcon('🏨','#1B6CC8',32),
  site:  makeIcon('🏛','#C0392B',28),
};

// ── Popup builders ────────────────────────────────────────────────────────
function restPopup(r){
  const stars = '⭐'.repeat(Math.round(r.rating||0));
  const bookBadge = r.must_book ? '<span class="pill pill-book">★ BOOK NOW</span>' : '';
  const xmas = r.christmas_note ? `<div class="pop-xmas">🎄 ${r.christmas_note}</div>` : '';
  return `<div class="pop">
    <div class="pop-header"><div class="pop-name">${r.name}</div></div>
    <div class="pop-meta">
      <span class="pill pill-price">${r.price||''}</span>
      <span class="pill pill-stars">${r.rating} ⭐</span>
      <span class="pill" style="background:#eee;color:#333">${r.cuisine}</span>
      ${bookBadge}
    </div>
    <div class="pop-tip">${r.tip}</div>
    ${xmas}
    <div class="pop-walk">🚶 ${r.walk_min} min from hotel</div>
  </div>`;
}

function hotelPopup(h){
  return `<div class="pop">
    <div class="pop-header">
      <div class="pop-hotel-name">${h.name}</div>
      <div class="pop-hotel-sub">Your hotel · ${h.city}</div>
    </div>
    <div class="pop-addr">📍 ${h.formatted_address||''}</div>
  </div>`;
}

function sitePopup(s){
  return `<div class="pop">
    <div style="padding:6px 0">
      <div class="pop-site-name">🏛 ${s.name}</div>
      <div class="pop-addr" style="margin-top:4px">📍 ${s.formatted_address||''}</div>
    </div>
  </div>`;
}

// ── Build all layers ──────────────────────────────────────────────────────
function buildLayers(){
  ['Seville','Segovia','Madrid'].forEach(city=>{
    // Restaurant cluster group
    const cg = L.markerClusterGroup({
      maxClusterRadius:50,
      iconCreateFunction(cluster){
        const n=cluster.getChildCount();
        return L.divIcon({html:`<div style="width:36px;height:36px;border-radius:50%;background:var(--gold);border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:bold;color:var(--navy)">${n}</div>`,className:'',iconSize:[36,36]});
      }
    });
    RESTAURANTS.filter(r=>r.city===city&&r.lat).forEach(r=>{
      const m = L.marker([r.lat,r.lng],{icon:ICONS.restaurant(r.must_book)})
        .bindPopup(restPopup(r),{maxWidth:280});
      m._restStem = r.stem;
      cg.addLayer(m);
      markerMap[r.stem] = m;
    });
    restaurantLayers[city] = cg;

    // Hotels
    const hl = L.layerGroup();
    HOTELS.filter(h=>h.city===city&&h.lat).forEach(h=>{
      L.marker([h.lat,h.lng],{icon:ICONS.hotel}).bindPopup(hotelPopup(h),{maxWidth:260}).addTo(hl);
    });
    hotelLayers[city] = hl;

    // Sites
    const sl = L.layerGroup();
    SITES.filter(s=>s.city===city&&s.lat).forEach(s=>{
      L.marker([s.lat,s.lng],{icon:ICONS.site}).bindPopup(sitePopup(s),{maxWidth:260}).addTo(sl);
    });
    siteLayers[city] = sl;
  });
}

// ── Switch city ───────────────────────────────────────────────────────────
function switchCity(city, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  // Remove old layers
  ['Seville','Segovia','Madrid'].forEach(c=>{
    if(restaurantLayers[c]) map.removeLayer(restaurantLayers[c]);
    if(hotelLayers[c])      map.removeLayer(hotelLayers[c]);
    if(siteLayers[c])       map.removeLayer(siteLayers[c]);
  });
  currentCity = city;
  filterPrice = 'ALL';
  document.querySelectorAll('#price-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-price="ALL"]').classList.add('active');
  document.getElementById('search-box').value='';
  document.getElementById('city-name-lbl').textContent = '· '+city;

  // Add new layers
  restaurantLayers[city].addTo(map);
  hotelLayers[city].addTo(map);
  siteLayers[city].addTo(map);

  const cc = CITY_CENTRES[city];
  map.setView([cc.lat,cc.lng],cc.zoom,{animate:true,duration:.8});
  renderSidebar();
}

// ── Filter ────────────────────────────────────────────────────────────────
function setFilter(type, val, btn){
  document.querySelectorAll('#price-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterPrice = val;
  renderSidebar();
}

function getFiltered(){
  const q = (document.getElementById('search-box').value||'').toLowerCase();
  return RESTAURANTS.filter(r=>{
    if(r.city !== currentCity) return false;
    if(filterPrice==='BOOK'&&!r.must_book) return false;
    if(filterPrice==='XMAS'&&!r.christmas_note) return false;
    if(filterPrice!=='ALL'&&filterPrice!=='BOOK'&&filterPrice!=='XMAS'&&r.price!==filterPrice) return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!(r.cuisine||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── Sidebar ───────────────────────────────────────────────────────────────
let focusedStem = null;
function renderSidebar(){
  const items = getFiltered();
  const el = document.getElementById('rest-list');
  document.getElementById('sidebar-count').textContent = items.length + ' restaurant' + (items.length!==1?'s':'');
  if(!items.length){ el.innerHTML='<div class="no-results">No restaurants match your filters.</div>'; return; }
  el.innerHTML = items.map(r=>`
    <div class="rest-item${focusedStem===r.stem?' focused':''}" onclick="focusRest('${r.stem}')" data-stem="${r.stem}">
      <div class="rest-name">${r.name}</div>
      <div class="rest-meta">
        <span class="pill pill-price">${r.price}</span>
        <span>⭐ ${r.rating}</span>
        <span style="color:#888">${r.cuisine}</span>
        ${r.must_book?'<span class="pill pill-book">Book</span>':''}
        ${r.christmas_note?'<span class="pill pill-xmas">🎄</span>':''}
      </div>
    </div>
  `).join('');
}

function focusRest(stem){
  focusedStem = stem;
  renderSidebar();
  const m = markerMap[stem];
  if(!m) return;
  // Ensure cluster is expanded
  const r = RESTAURANTS.find(x=>x.stem===stem);
  if(r&&r.lat) map.setView([r.lat,r.lng],17,{animate:true,duration:.6});
  setTimeout(()=>m.openPopup(),400);
}

// ── Init ──────────────────────────────────────────────────────────────────
buildLayers();
restaurantLayers['Seville'].addTo(map);
hotelLayers['Seville'].addTo(map);
siteLayers['Seville'].addTo(map);
renderSidebar();
</script>
</body>
</html>
